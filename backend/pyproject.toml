[project]
name = "grounded-answers"
version = "0.1.0"
description = "Multi-tenant document Q&A assistant"
authors = [
    { name = "Hamza Asif", email = "hamza.asif6182@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.158.1",
    "markdown-it-py==4.2.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "procrastinate==3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pypdf==6.21.2",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "tokenizers==0.23.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
operator = [
    "click>=8.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E: pycodestyle errors (whitespace, indentation, imports)
# W: pycodestyle warnings (deprecated code patterns)
# F: Pyflakes (undefined names, duplicate imports, etc.)
# I: isort (import sorting)
# UP: pyupgrade (modernize Python syntax)
# B: flake8-bugbear (logical bugs, security issues)
# C4: flake8-comprehensions (list/dict/set comprehension optimizations)
# S: bandit security checks
# RUF: Ruff-specific (additional checks by Ruff)
select = ["E", "W", "F", "I", "UP", "B", "C4", "S", "RUF"]
# Ignore: line too long (enforced by formatter)
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# S101: allow assert in tests (pytest uses them)
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# db: needs the PostgreSQL test database and psql (ADR 0006). Run with: pytest -m db
# Unit tests run with: pytest -m "not db"
# eval: the full retrieval evaluation (real model, test database). Deselected unless -m eval is given.
addopts = "--strict-markers"
markers = [
    "db: needs PostgreSQL and psql through PSQL_COMMAND (ADR 0006); fails, never skips, when unavailable",
    "eval: the retrieval evaluation with the real model; runs only when -m names it (pytest -m eval), never in CI",
]

[tool.mypy]
# Strict mode: enforce all type checking rules for maximum safety
# (includes disallow_untyped_defs, check_untyped_defs, no_implicit_optional, etc.)
strict = true
# Show error codes for easier lookup
show_error_codes = true
# Enable pydantic plugin for better type checking of pydantic-settings
plugins = ["pydantic.mypy"]

[tool.uv]
# huggingface-hub 2.3.0 was uploaded on 2026-10-23, inside the one-week cooldown (ADR 0005). tokenizers n# accepts 1.x, so pin 1.33.0 until 2.x is older than a week. Remove this line then.
constraint-dependencies = ["huggingface-hub==1.33.0"]
