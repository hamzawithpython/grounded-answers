name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --group operator
      - run: uv run ruff check src/ tests/ scripts/ alembic/
      - run: uv run ruff format --check src/ tests/ scripts/ alembic/
      - run: uv run mypy src/ tests/ scripts/ alembic/
      - run: uv run --with pip-audit pip-audit
      - run: uv run pytest -m "not db" -rs

  backend-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same pinned image as docker-compose.yml (ADR 0006)
        image: pgvector/pgvector:0.8.7-pg17
        env:
          # Obviously fake, test-only (ADR 0006). Never used by the app.
          POSTGRES_PASSWORD: ci-test-only-not-a-secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Valkey, same pinned image as docker-compose.yml (ADR 0003, ADR 0009). The service is
        # named "redis" because the app's REDIS_URL uses the redis:// scheme (ADR 0003).
        image: valkey/valkey:9.1.2-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Admin URL for the test fixture only: drop, create, bootstrap (ADR 0006).
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-test-only-not-a-secret@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --group operator
      # The pinned embedding model (ADR 0021, ADR 0022 decision D7). The cache is keyed by the pinned revision.
      # The fetch step checks every file's SHA-256 and size, so a corrupted or tampered cache fails loudly here.
      - name: Restore the pinned embedding model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/grounded-answers-models
          key: embedding-model-614241f622f53c4eeff9890bdc4f31cfecc418b3
      - name: Fetch and verify the pinned embedding model
        run: |
          uv run python -m grounded_answers.embedding.fetch "$HOME/grounded-answers-models"
          echo "TEST_EMBEDDING_MODEL_DIR=$HOME/grounded-answers-models/614241f622f53c4eeff9890bdc4f31cfecc418b3" >> "$GITHUB_ENV"
      # psql comes from the pinned server image, so its version matches the server.
      # The fixture pipes the same .sql files the operator runs (ADR 0006 amendment).
      - name: Point the fixture at psql in the PostgreSQL container
        run: |
          cid=$(docker ps -q --filter ancestor=pgvector/pgvector:0.8.7-pg17 | head -n 1)
          if [ -z "$cid" ]; then echo "PostgreSQL service container not found"; exit 1; fi
          echo "PSQL_COMMAND=docker exec -i -e MIGRATION_ROLE_SCRAM -e APP_USER_SCRAM -e WORKER_USER_SCRAM -e ROLE_SCRAM $cid psql" >> "$GITHUB_ENV"
      - run: uv run pytest -m db -v -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
