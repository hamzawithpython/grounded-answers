version: 2
updates:
  # GitHub Actions: keep SHA-pinned actions updated
  # Dependabot detects pinned SHAs, finds new commits, and creates PRs with updated SHAs
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    # Wait 7 days before adopting a new release (security advisories are not delayed)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps): "
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps): "
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Backend Python dependencies (uv)
  # Uses "uv" ecosystem (not "pip") to update uv.lock correctly
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps): "
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    # @types/node must match Node.js 24 runtime; major updates require manual review
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
